name: Daily Morning Digest

on:
  schedule:
    - cron: '0 22 * * *'  # 毎日 22:00 UTC = 翌朝 7:00 JST
  workflow_dispatch:       # 手動実行ボタンも有効

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          TRAINING_URL: ${{ secrets.TRAINING_URL }}
        run: python fetch_news.py

      - name: Commit and push index.html
        run: |
          git config user.name "Morning Digest Bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet && echo "変更なし" && exit 0
          git commit -m "📰 Daily digest: $(TZ=Asia/Tokyo date +'%Y-%m-%d')"
          git push
